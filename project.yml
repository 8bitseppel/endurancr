# XcodeGen project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
# Then open Endurancr.xcodeproj in Xcode and set your Team for signing.
name: Endurancr
options:
  bundleIdPrefix: app.endurancr
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  TrainingCore:
    path: TrainingCore

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Signing baked in so `xcodegen generate` never wipes it (previously had to be
    # re-entered in Xcode after every regen). Automatic signing lets Xcode manage
    # the provisioning profile for this personal team.
    DEVELOPMENT_TEAM: CZS8ZHY988
    CODE_SIGN_STYLE: Automatic

# Shared schemes defined here so `xcodegen generate` recreates them every time
# (Xcode's auto-generated schemes live in xcuserdata and get wiped on regen).
schemes:
  Endurancr:
    build:
      targets:
        Endurancr: all
    run:
      config: Debug
    archive:
      config: Release
  Endurancr Watch App:
    build:
      targets:
        Endurancr Watch App: all
    run:
      config: Debug
  EndurancrWidgets:
    build:
      targets:
        EndurancrWidgets: all

targets:
  Endurancr:
    type: application
    platform: iOS
    sources:
      - path: App-iOS
      - path: Shared
      - path: LiveActivity
    dependencies:
      - package: TrainingCore
      - target: Endurancr Watch App
        embed: true
      - target: EndurancrWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.endurancr
        INFOPLIST_FILE: App-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App-iOS/Endurancr.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  EndurancrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App-iOS-Widgets
      - path: LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.endurancr.widgets
        INFOPLIST_FILE: App-iOS-Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  Endurancr Watch App:
    type: application
    platform: watchOS
    sources:
      - path: App-watchOS
      - path: Shared
    dependencies:
      - package: TrainingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.endurancr.watchkitapp
        INFOPLIST_FILE: App-watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: App-watchOS/Watch.entitlements
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
